<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="TeenMind Shorts — শেখার ছোট ভিডিও ও ছবি">
  <title>TeenMind Shorts</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app" id="app">
    <header class="topbar"><a class="brand" href="#" aria-label="TeenMind Shorts home"><span class="brand-mark">▶</span> TeenMind</a><div class="top-actions"><span class="xp-pill">✦ <b id="score">০</b> XP</span><button class="icon-button" id="sound-toggle" aria-label="শব্দ চালু করুন" title="শব্দ">🔇</button></div></header>
    <section id="feed" class="feed" aria-label="শর্টস ফিড" aria-live="polite"><div class="state-card">শর্টস লোড হচ্ছে…</div></section>
    <nav class="actions" aria-label="ভিডিও অ্যাকশন">
      <button class="action" data-action="like" aria-label="লাইক"><span class="action-icon">♡</span><small id="like-count">১২০</small></button>
      <button class="action" data-action="comment" aria-label="কমেন্ট"><span class="action-icon">▤</span><small>কমেন্ট</small></button>
      <button class="action" data-action="share" aria-label="শেয়ার"><span class="action-icon">↗</span><small>শেয়ার</small></button>
      <button class="action" data-action="next" aria-label="পরের ভিডিও"><span class="action-icon next-icon">⌄</span><small>পরেরটা</small></button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="install-banner" class="install-banner hidden"><div><strong>TeenMind অ্যাপ ইনস্টল করুন</strong><p>হোমস্ক্রিন থেকে দ্রুত খুলুন।</p></div><button id="install-btn" class="install-btn">ইনস্টল</button><button id="close-banner" class="close-btn" aria-label="বন্ধ করুন">×</button></div>
    <footer class="bottom-nav"><span class="selected">⌂ <small>হোম</small></span><span>◉ <small>শর্টস</small></span><span>＋ <small>তৈরি</small></span><span>♡ <small>সেভ</small></span><span>☻ <small>প্রোফাইল</small></span></footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
